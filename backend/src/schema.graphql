# A Todo represents one task stored in the database.
type Todo {
  # Unique numeric identifier generated by the database.
  id: Int!

  # Human-readable task description.
  title: String!

  # Indicates whether the Todo has been completed.
  completed: Boolean!

  # ISO date string representing when the Todo was created.
  createdAt: String!

  # ISO date string representing the most recent update.
  updatedAt: String!
}

# Input accepted when creating a Todo.
input CreateTodoInput {
  # A new Todo must always contain a title.
  title: String!
}

# Input accepted when updating a Todo.
input UpdateTodoInput {
  # Title is optional because the caller may only change completed.
  title: String

  # Completed is optional because the caller may only edit the title.
  completed: Boolean
}

# Read operations live under GraphQL Query.
type Query {
  # Return every Todo.
  todos: [Todo!]!

  # Return one Todo using its database ID.
  todo(id: Int!): Todo
}

# Write operations live under GraphQL Mutation.
type Mutation {
  # Add a new Todo.
  createTodo(input: CreateTodoInput!): Todo!

  # Modify an existing Todo.
  updateTodo(id: Int!, input: UpdateTodoInput!): Todo!

  # Remove an existing Todo.
  deleteTodo(id: Int!): Todo!
}
